name: Update README stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_readme_stats.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pillow

      - name: Refresh stats in README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_readme_stats.py

      - name: Commit if changed
        run: |
          git config user.name "IvanCodesDev"
          git config user.email "IvanCodesDev@users.noreply.github.com"
          git add README.md assets/productive-time.png
          if git diff --staged --quiet; then
            echo "No stats changes"
            exit 0
          fi
          git commit -m "chore: refresh profile stats"
          git push
